name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm version:check
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @vektor/api exec playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y xvfb xdotool ffmpeg x11-utils bubblewrap util-linux apparmor
      - name: Verify isolated execution support on the CI host
        run: node scripts/ci-isolation.mjs
      - run: pnpm test
      - run: pnpm build
      - run: node scripts/workspace-smoke.mjs
      - run: pnpm release:pack
      - run: pnpm release:verify
      - uses: actions/upload-artifact@v7
        with:
          name: api-web-linux-x64
          path: release-artifacts/*
          if-no-files-found: error
      - run: docker build -t vektor:phase7-check .
      - run: docker build --target web -t vektor-web:split-check .
      - run: python3 scripts/verify-docker-split.py vektor:phase7-check vektor-web:split-check
      - run: python3 scripts/verify-docker-updater.py vektor:phase7-check
      - run: python3 scripts/verify-docker-updater.py vektor:phase7-check vektor-web:split-check
      - run: python3 scripts/verify-phase7.py
      - run: docker run --rm -i --entrypoint node -e VEKTOR_API_ROOT=/app vektor:phase7-check --input-type=module < scripts/browser-smoke.mjs
      - run: docker run --rm -i --shm-size=256m --entrypoint node -e VEKTOR_API_ROOT=/app vektor:phase7-check --input-type=module < scripts/mcp-smoke.mjs

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            bundles: deb,appimage
          - os: windows-latest
            platform: windows
            bundles: nsis
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libfuse2t64 file patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages && pnpm --filter @vektor/web build
      - run: cargo fmt --manifest-path apps/web/src-tauri/Cargo.toml --check
      - if: matrix.platform == 'linux'
        run: pnpm --filter @vektor/api exec playwright install-deps chromium
      - run: pnpm desktop:check
      - run: pnpm --filter @vektor/web exec tauri build --bundles ${{ matrix.bundles }}
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
      - run: node scripts/verify-desktop-service.mjs
      - name: Validate Windows installer script syntax
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/install.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}-x64
          path: |
            apps/web/src-tauri/target/release/bundle/deb/*.deb
            apps/web/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/web/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

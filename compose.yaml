services:
  vektor:
    build:
      context: .
    image: vektor:local
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8787"
      VEKTOR_DATA_DIR: /data
      VEKTOR_ENABLE_DEV_STREAM: ${VEKTOR_ENABLE_DEV_STREAM:-0}
      VEKTOR_LOG_LEVEL: ${VEKTOR_LOG_LEVEL:-info}
      VEKTOR_LOG_FILE: ${VEKTOR_LOG_FILE:-1}
      VEKTOR_LOG_MAX_BYTES: ${VEKTOR_LOG_MAX_BYTES:-10485760}
      VEKTOR_LOG_RETAINED_FILES: ${VEKTOR_LOG_RETAINED_FILES:-5}
      VEKTOR_MAX_FILE_BYTES: ${VEKTOR_MAX_FILE_BYTES:-26214400}
      VEKTOR_CHANNEL_FILE_BYTES: ${VEKTOR_CHANNEL_FILE_BYTES:-262144000}
      VEKTOR_RUN_TIMEOUT_MS: ${VEKTOR_RUN_TIMEOUT_MS:-120000}
      VEKTOR_SCHEDULER_ENABLED: ${VEKTOR_SCHEDULER_ENABLED:-1}
      VEKTOR_SCHEDULER_TICK_MS: ${VEKTOR_SCHEDULER_TICK_MS:-1000}
    volumes:
      - vektor-data:/data
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  vektor-data:

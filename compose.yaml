services:
  vektor:
    build:
      context: .
    image: vektor:local
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8787"
      VEKTOR_DATA_DIR: /data
      VEKTOR_ENABLE_DEV_STREAM: "1"
      VEKTOR_LOG_LEVEL: info
    volumes:
      - vektor-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  vektor-data:
